<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="10" y1="58" x2="58" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#07070A"/>

  <!-- Outer crossbar arc -->
  <path d="M10 30 A27 27 0 0 1 37 57"
    fill="none" stroke="#A78BFA" stroke-width="1.6"
    stroke-linecap="round" opacity="0.55"/>

  <!-- Inner crossbar arc -->
  <path d="M10 44 A15 15 0 0 1 25 59"
    fill="none" stroke="#A78BFA" stroke-width="2"
    stroke-linecap="round" opacity="0.85"/>

  <!-- Main sweep arc — origin to peak -->
  <path d="M10 58 A52 52 0 0 1 58 10"
    fill="none" stroke="url(#g)" stroke-width="5.5"
    stroke-linecap="round"/>

  <!-- Origin dot -->
  <circle cx="10" cy="58" r="4.2" fill="#7C3AED"/>

  <!-- Peak dot -->
  <circle cx="58" cy="10" r="2" fill="#C4B5FD" opacity="0.75"/>
</svg>
